name: Vérifier le site

# Vérifications automatiques mises en pause tant que le quota GitHub Actions
# du compte est épuisé. Le workflow reste disponible manuellement plus tard.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Vérifier la logique de dates et vidéos
        run: node --test tests/*.test.mjs
      - name: Compiler Astro
        run: npm run build
      - name: Vérifier le Worker et ses bindings sans le déployer
        run: npx wrangler deploy --dry-run --outdir=/tmp/voyage-worker-test
